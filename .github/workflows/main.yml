          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting archive: $f"
              unzip -o "$f" -x "*.zip" || true
            fi
          done
          echo "=== DIRECTORY TREE AFTER EXTRACTION ==="
          ls -la
          ls -la app/src/main/assets/ || echo "assets/ dir not found (non-fatal)"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew || true
      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Prepare Artifact
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/NEXUS-Store-Universal.apk \;
          echo "=== COMPILED APK DETAILS ==="
          ls -lh output/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Store-Universal
          path: output/NEXUS-Store-Universal.apk
          retention-days: 14
