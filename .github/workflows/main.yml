name: Build NEXUS Android APK
"on":
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Auto-Extract ZIP (If Uploaded)
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting archive: $f"
              unzip -o "$f" -x "*.zip" || true
            fi
          done
          echo "=== DIRECTORY TREE AFTER EXTRACTION ==="
          ls -la
          ls -la app/src/main/assets/ || echo "assets/ not found"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
